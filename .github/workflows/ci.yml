name: CI

on:
  push:
    branches: [ main ]
  pull_request:


jobs:
  lint-skills:
    name: Lint SKILL.md frontmatter
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Verify frontmatter (name + description) on every SKILL.md
      run: |
        set -e
        echo "Verifying frontmatter (name + description) on every SKILL.md"
        fail=0
        for f in $(find skills -name SKILL.md); do
          dir_name=$(basename "$(dirname "$f")")
          name=$(awk 'BEGIN{ok=0} /^---$/{ok++; next} ok==1 && /^name:/{print $2; exit}' "$f")
          desc_line=$(awk 'BEGIN{ok=0} /^---$/{ok++; next} ok==1 && /^description:/{print; exit}' "$f")
          if [ "$name" != "$dir_name" ]; then
            echo "FAIL $f: name='$name' != dir='$dir_name'"
            fail=1
          fi
          if [ -z "$desc_line" ]; then
            echo "FAIL $f: empty description"
            fail=1
          fi
          lines=$(wc -l < "$f")
          if [ "$lines" -ge 500 ]; then
            echo "WARN $f: $lines lines (spec recommends < 500)"
          fi
        done
        [ "$fail" -eq 0 ]

  lint-references:
    name: Lint references/ filenames
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Reference file naming
      run: |
        set -e
        echo "Reference file naming"
        fail=0
        for dir in skills/*/; do
          name=$(basename "$dir")
          if [ "$name" = "symfony-ai" ]; then continue; fi
          if [ -d "$dir/references" ]; then
            for f in "$dir"/references/*.md; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .md)
              case "$base" in
                api|patterns|gotchas|bridges|embeddings|config|processors|security) ;;
                *) echo "WARN $f: unexpected reference name '$base'"; fail=1 ;;
              esac
            done
          fi
        done
        [ "$fail" -eq 0 ]

  lint-descriptions:
    name: Lint skill descriptions quality
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Verify description length and routing clause
      run: bash scripts/lint-descriptions.sh

  lint-references-links:
    name: Verify reference cross-linking
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Check consistency between SKILL.md and references/
      run: bash scripts/check-references-links.sh

  check-composer:
    name: Composer package existence
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Every symfony/ai-* and symfony/mcp-* package cited must exist on Packagist
      run: |
        set -e
        fail=0
        # The mcp- prefix matters: symfony/mcp-bundle was a permanent blind spot
        # while the pattern only covered symfony/ai-*.
        pkgs=$(grep -rhoE 'symfony/(ai|mcp)-[a-z0-9-]+' skills/ | sort -u)
        for p in $pkgs; do
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://repo.packagist.org/p2/$p.json" || echo "000")
          if [ "$status" != "200" ]; then
            echo "FAIL package '$p' not found on packagist ($status)"
            fail=1
          fi
        done
        [ "$fail" -eq 0 ]

  check-snippets:
    name: Lint PHP snippets
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
    - name: php -l every copy-pasteable php block
      run: bash scripts/check-snippets.sh

  check-symbols:
    name: Symbol existence against symfony/ai
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Clone the symfony/ai monorepo
      run: git clone --depth=1 https://github.com/symfony/ai.git /tmp/symfony-ai
    - name: Every Symfony\AI\* symbol cited must resolve to a real file
      env:
        SYMFONY_AI_SRC: /tmp/symfony-ai
      run: bash scripts/check-symbols.sh

  test-skills-ref:
    name: Test against upstream agentskills/skills-ref
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Clone upstream skills-ref suite
      run: git clone --depth=1 https://github.com/agentskills/agentskills.git /tmp/skills-ref
    - name: Locate skills-ref suite
      run: |
        if [ ! -d /tmp/skills-ref/skills-ref ]; then
          echo "skills-ref suite not found at expected path"
          exit 1
        fi
    - name: Install skills-ref (editable)
      working-directory: /tmp/skills-ref/skills-ref
      run: |
        python3 -m pip install --quiet -e .
    - name: Run skills-ref validate against our skills
      run: |
        set +e
        fail=0
        for d in "$GITHUB_WORKSPACE"/skills/*/; do
          [ -d "$d" ] || continue
          name=$(basename "$d")
          # symfony-ai is the orchestrator meta-skill, not a single validatable skill.
          case "$name" in
            symfony-ai) continue ;;
          esac
          echo "::group::Validating $name"
          skills-ref validate "$d" || fail=1
          echo "::endgroup::"
        done
        exit "$fail"
